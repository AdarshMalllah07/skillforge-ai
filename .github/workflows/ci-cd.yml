name: Next.js CI/CD Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Type Check
              run: npm run lint

            - name: Unit & Integration Tests
              run: npm test
              env:
                  JWT_SECRET: ci_jwt_secret_for_tests_only

            - name: Build Project
              run: npm run build
              env:
                  # Build-time placeholders so CI can compile without real secrets
                  MONGODB_URI: mongodb://127.0.0.1:27017/skillforge_ci
                  JWT_SECRET: ci_jwt_secret_for_build_only
                  GEMINI_API_KEY: ci_placeholder_key
                  APP_URL: http://localhost:3000

    # Deploys production to https://skillforge-ai-h35u.vercel.app on main pushes.
    # Requires GitHub repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
    deploy-production:
        name: Deploy to Vercel (skillforge-ai-h35u)
        needs: build-and-test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment:
            name: production
            url: https://skillforge-ai-h35u.vercel.app

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  cache: "npm"

            - name: Install Vercel CLI
              run: npm install -g vercel@latest

            # Explicit link avoids stale/missing .vercel and wrong secret mixups.
            - name: Link Vercel Project
              env:
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: |
                  set -euo pipefail
                  if [ -z "${VERCEL_ORG_ID:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ] || [ -z "${VERCEL_TOKEN:-}" ]; then
                    echo "::error::Missing VERCEL_ORG_ID, VERCEL_PROJECT_ID, or VERCEL_TOKEN secret"
                    exit 1
                  fi
                  mkdir -p .vercel
                  python3 - <<PY
                  import json, os
                  path = ".vercel/project.json"
                  payload = {
                      "orgId": os.environ["VERCEL_ORG_ID"],
                      "projectId": os.environ["VERCEL_PROJECT_ID"],
                  }
                  with open(path, "w", encoding="utf-8") as f:
                      json.dump(payload, f)
                  print(f"Wrote {path}: orgId={payload['orgId']} projectId={payload['projectId']}")
                  PY
                  # Fail fast with a clear message if secrets/token cannot access the project
                  curl -fsS -H "Authorization: Bearer ${VERCEL_TOKEN}" \
                    "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
                    | tee /tmp/vercel-project.json >/dev/null
                  python3 - <<'PY'
                  import json
                  data = json.load(open("/tmp/vercel-project.json"))
                  name = data.get("name") or "<unknown>"
                  print(f"Verified Vercel project access: {name}")
                  if name != "skillforge-ai-h35u":
                      raise SystemExit(f"Unexpected project name: {name}")
                  PY

            - name: Pull Vercel Environment
              run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
              env:
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

            - name: Build Project (Vercel)
              run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
              env:
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

            # Upload can flake with HTML error pages from Vercel API ("Unexpected token '<'").
            - name: Deploy Prebuilt to Production
              id: deploy
              env:
                  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
                  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
                  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
              run: |
                  set -euo pipefail
                  attempt=1
                  max_attempts=4
                  while [ "$attempt" -le "$max_attempts" ]; do
                    echo "Deploy attempt ${attempt}/${max_attempts}…"
                    # Capture stdout+stderr separately so retries don't treat error spam as a URL
                    if url=$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" 2> /tmp/vercel-deploy.err); then
                      echo "url=$url" >> "$GITHUB_OUTPUT"
                      echo "Deployed deployment URL: $url"
                      echo "Production alias should be: https://skillforge-ai-h35u.vercel.app"
                      exit 0
                    fi
                    echo "Deploy attempt ${attempt} failed:"
                    cat /tmp/vercel-deploy.err || true
                    if [ "$attempt" -eq "$max_attempts" ]; then
                      echo "::error::Deploy failed after ${max_attempts} attempts"
                      exit 1
                    fi
                    sleep_seconds=$((attempt * 20))
                    echo "Upload/API failed; retrying in ${sleep_seconds}s…"
                    sleep "$sleep_seconds"
                    attempt=$((attempt + 1))
                  done
