name: Next.js CI/CD Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  cache: "npm"

            - name: Install Dependencies
              run: npm ci

            - name: Type Check
              run: npm run lint

            - name: Build Project
              run: npm run build
              env:
                  # Build-time placeholders so CI can compile without real secrets
                  MONGODB_URI: mongodb://127.0.0.1:27017/skillforge_ci
                  JWT_SECRET: ci_jwt_secret_for_build_only
                  GEMINI_API_KEY: ci_placeholder_key
                  APP_URL: http://localhost:3000
